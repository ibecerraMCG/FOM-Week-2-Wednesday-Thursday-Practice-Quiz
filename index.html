<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Wednesday and Thursday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */
            --question-text-color: #8ab4f8; /* Light blue for questions */
            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 2 Wednesday and Thursday Practice Quiz</h1>

    <div id="quiz-container">
        <!-- Questions will be loaded here by JavaScript -->
    </div>

    <script>
        const quizData = [
            // Cell Signaling Questions
            {
                learningObjective: "LO1 (Cell Signaling): Describe the central components and properties of G-protein coupled receptor signaling pathways.",
                question: "Activation of a G protein-coupled receptor (GPCR) by an agonist leads to a conformational change that allows it to function as a guanine nucleotide exchange factor (GEF). This GEF activity is directed towards which of the following molecules?",
                options: { A: "The Gα subunit of the heterotrimeric G protein", B: "The Gβγ subunit complex", C: "An adjacent receptor tyrosine kinase", D: "A downstream effector like adenylyl cyclase", E: "The receptor itself (autophosphorylation)" },
                correctAnswer: "A",
                rationale: "Upon agonist binding, the activated GPCR interacts with a heterotrimeric G protein. This interaction causes the Gα subunit to release its bound GDP and bind a new molecule of GTP. This exchange of GDP for GTP is the definition of GEF activity, which switches the Gα subunit to its 'ON' state.",
                source: "Source (Cell Signaling, Slide 7): The 'G-Proteins and the GTPase Cycle' diagram shows the Guanine Nucleotide Exchange Factor (GEF) acting on the G protein to facilitate the switch from a GDP-bound 'OFF' state to a GTP-bound 'ON' state."
            },
            {
                learningObjective: "LO1 (Cell Signaling): Describe the central components and properties of G-protein coupled receptor signaling pathways.",
                question: "To terminate a G protein signal, the Gα subunit must hydrolyze its bound GTP to GDP. This intrinsic GTPase activity is often slow. The rate of this inactivation step is dramatically increased by which class of proteins?",
                options: { A: "Guanine nucleotide exchange factors (GEFs)", B: "GTPase-activating proteins (GAPs)", C: "G protein-coupled receptor kinases (GRKs)", D: "Phosphodiesterases (PDEs)", E: "Protein Kinase A (PKA)" },
                correctAnswer: "B",
                rationale: "GTPase-activating proteins (GAPs), such as Regulators of G protein Signaling (RGS proteins), act as the 'brakes' for the system. They bind to the active, GTP-bound Gα subunit and accelerate its intrinsic GTPase activity, leading to the rapid hydrolysis of GTP to GDP and returning the G protein to its inactive state.",
                source: "Source (Cell Signaling, Slide 8): The diagram shows 'RGS proteins (GAP)' accelerating the conversion of the active Gα-GTP back to the inactive Gα-GDP."
            },
            {
                learningObjective: "LO1 (Cell Signaling): Describe the central components and properties of G-protein coupled receptor signaling pathways.",
                question: "Chronic stimulation of a GPCR often leads to desensitization, a process that reduces the cell's responsiveness. The initial step in this process involves the phosphorylation of the activated receptor by a specific kinase, which then promotes the binding of another protein. Which protein binds to the phosphorylated GPCR to uncouple it from G proteins and promote its internalization?",
                options: { A: "Gαs", B: "Gβγ", C: "Arrestin", D: "Calmodulin", E: "Protein Kinase C (PKC)" },
                correctAnswer: "C",
                rationale: "Following agonist-induced activation and phosphorylation by a G protein-coupled receptor kinase (GRK), Arrestin is recruited from the cytosol to the GPCR. Arrestin binding sterically hinders the receptor's interaction with G proteins, effectively uncoupling it from downstream signaling. Arrestin also acts as an adapter to link the receptor to clathrin, facilitating its endocytosis.",
                source: "Source (Cell Signaling, Slide 11): The 'Desensitization and downregulation of GPCR pathways' diagram clearly shows GRK phosphorylating the receptor, followed by the binding of 'Arrestin', which leads to uncoupling and subsequent internalization."
            },
            {
                learningObjective: "LO2 (Cell Signaling): Explain how G-protein signaling pathways are involved the regulation of smooth muscle tone, photoreception in the retina, and in symptoms associated with cholera.",
                question: "The toxin produced by Vibrio cholerae causes profuse watery diarrhea by irreversibly activating a specific G protein in intestinal epithelial cells. The toxin does this by ADP-ribosylating the Gα subunit, locking it in a GTP-bound state. Which Gα subunit is the target of cholera toxin?",
                options: { A: "Gαq", B: "Gαi", C: "Gαs", D: "Gαt (transducin)", E: "Gα12/13" },
                correctAnswer: "C",
                rationale: "Cholera toxin specifically targets Gαs. The constitutive activation of Gαs leads to the persistent activation of adenylyl cyclase, resulting in extremely high levels of intracellular cAMP. In intestinal epithelial cells, high cAMP activates PKA, which phosphorylates and opens the CFTR chloride channel, leading to massive secretion of Cl-, Na+, and water into the intestinal lumen.",
                source: "Source (Cell Signaling, Slide 19): The diagram 'ADP-ribosylation of Gas and Gai Increases cAMP Levels' shows Cholera Toxin (CT) acting on the Gsα subunit, causing 'Activation of E' (adenylyl cyclase)."
            },
            {
                learningObjective: "LO2 (Cell Signaling): Explain how G-protein signaling pathways are involved the regulation of smooth muscle tone, photoreception in the retina, and in symptoms associated with cholera.",
                question: "In the photoreceptor cells of the retina, the process of phototransduction is initiated when light activates rhodopsin. Activated rhodopsin then activates a specific G protein called transducin. What is the direct effector enzyme activated by the Gα subunit of transducin (Gαt)?",
                options: { A: "Adenylyl cyclase (AC)", B: "Phospholipase C (PLC)", C: "cGMP phosphodiesterase (PDE6)", D: "RhoA", E: "Protein Kinase A (PKA)" },
                correctAnswer: "C",
                rationale: "In the dark, rod cells have high levels of cGMP, which keeps cGMP-gated cation channels open. When light strikes, activated rhodopsin activates transducin (Gt). The Gαt-GTP subunit then activates cGMP phosphodiesterase (PDE6), which rapidly hydrolyzes cGMP to GMP. The resulting drop in cGMP concentration causes the cation channels to close, hyperpolarizing the cell.",
                source: "Source (Cell Signaling, Slide 16): The 'Rhodopsin Signaling' diagram shows that Transducin (Gt) activates 'Phosphodiesterase (PDE6)', which in turn converts cGMP to GMP."
            },
            {
                learningObjective: "LO2 (Cell Signaling): Explain how G-protein signaling pathways are involved the regulation of smooth muscle tone...",
                question: "Contraction of vascular smooth muscle is initiated by agonists like norepinephrine and vasopressin. These agonists bind to GPCRs that couple to two major G protein pathways, leading to an increase in intracellular calcium and sensitization of the contractile apparatus. Which two Gα protein families are primarily responsible for mediating smooth muscle contraction?",
                options: { A: "Gαs and Gαi", B: "Gαq and Gα12/13", C: "Gαt and Gαs", D: "Gαi and Gαq", E: "Gα12/13 and Gαt" },
                correctAnswer: "B",
                rationale: "Smooth muscle contraction is mediated by two main GPCR pathways. The Gαq pathway activates phospholipase C, leading to the production of IP3 and subsequent release of Ca2+ from the sarcoplasmic reticulum. The Gα12/13 pathway activates RhoA, which in turn activates ROCK, leading to the inhibition of myosin light chain phosphatase (MLCP) and promoting a state of contraction (calcium-independent contraction or calcium sensitization).",
                source: "Source (Cell Signaling, Slide 13): The diagram is titled 'Contractile Agonists Signal Through Gaq and Ga12/13' and clearly shows both pathways converging to promote smooth muscle contraction."
            },
            {
                learningObjective: "LO3 (Cell Signaling): Explain how cGMP signaling relaxes smooth muscle, and how this pathway is targeted to treat stable angina and erectile dysfunction.",
                question: "A patient with stable angina is prescribed sublingual nitroglycerin. The therapeutic effect of this drug in relieving chest pain is due to the dilation of coronary arteries. Nitroglycerin achieves this by being converted in the body to a signaling molecule that directly activates soluble guanylyl cyclase. What is this signaling molecule?",
                options: { A: "Cyclic AMP (cAMP)", B: "Nitric oxide (NO)", C: "Prostacyclin (PGI2)", D: "Acetylcholine", E: "Calcium (Ca2+)" },
                correctAnswer: "B",
                rationale: "Nitroglycerin is a prodrug that is metabolized to release nitric oxide (NO). NO is a potent but short-lived signaling molecule that diffuses into smooth muscle cells and binds to the heme group of soluble guanylyl cyclase, activating the enzyme. This leads to increased production of cGMP, which promotes vasodilation.",
                source: "Source (Cell Signaling, Slide 26): The diagram 'Nitroglycerin and Nitroprusside Can Dilate Coronary Arteries' shows both drugs leading to the production of 'NO', which causes vasodilation."
            },
            {
                learningObjective: "LO3 (Cell Signaling): Explain how cGMP signaling relaxes smooth muscle, and how this pathway is targeted to treat stable angina and erectile dysfunction.",
                question: "Sildenafil is a medication used to treat erectile dysfunction. It works by enhancing the smooth muscle relaxation that is initiated by sexual stimulation and nitric oxide (NO) release. Sildenafil achieves this by inhibiting which of the following enzymes?",
                options: { A: "Guanylyl cyclase", B: "Protein Kinase G (PKG)", C: "Nitric oxide synthase (NOS)", D: "Phosphodiesterase 5 (PDE5)", E: "Adenylyl cyclase" },
                correctAnswer: "D",
                rationale: "The NO/cGMP pathway mediates smooth muscle relaxation. The signal is terminated by phosphodiesterases (PDEs), which break down cGMP. Sildenafil is a selective inhibitor of PDE5, the predominant isoform in the corpus cavernosum. By inhibiting PDE5, sildenafil prevents the breakdown of cGMP, leading to its accumulation and enhanced, prolonged smooth muscle relaxation and vasodilation.",
                source: "Source (Cell Signaling, Slide 28): The diagram 'Erectile Dysfunction Drugs Target PDE5 to Increase cGMP' clearly shows the 'PDE-5 inhibitor site of action' blocking the conversion of cGMP to 5' GMP, thus promoting 'Smooth Muscle Relaxation (erection)'."
            },
            {
                learningObjective: "LO3 (Cell Signaling): Explain how cGMP signaling relaxes smooth muscle...",
                question: "The activation of Protein Kinase G (PKG) by cGMP leads to smooth muscle relaxation through multiple mechanisms. One key action of PKG is the activation of an enzyme that dephosphorylates the myosin light chain, directly opposing the action of MLCK. What enzyme is activated by PKG to promote relaxation?",
                options: { A: "RhoA", B: "Phospholipase C", C: "Myosin light chain phosphatase (MLCP)", D: "Adenylyl cyclase", E: "Calmodulin" },
                correctAnswer: "C",
                rationale: "Smooth muscle contraction is triggered by the phosphorylation of the myosin light chain (MLC) by myosin light chain kinase (MLCK). Relaxation is achieved by dephosphorylating MLC. Protein Kinase G (PKG) promotes relaxation in part by activating myosin light chain phosphatase (MLCP), which removes the phosphate from MLC.",
                source: "Source (Cell Signaling, Slide 25): The diagram 'PKG1 Relaxes Smooth Muscle by Blocking Contraction Signaling' explicitly shows an arrow from 'PKG1 Activates:' pointing to 'MLC-phosphatase'."
            },
            {
                learningObjective: "LO4 (Cell Signaling): Identify the central pathways activated by growth factors and how their dysregulation contributes to cancer.",
                question: "A patient with colorectal cancer is found to have an activating mutation in the KRAS gene. This mutation typically renders the KRAS protein constitutively active by locking it in the GTP-bound state. This mutation would lead to the persistent activation of which downstream signaling pathway, promoting cell proliferation?",
                options: { A: "The JAK/STAT pathway", B: "The NF-κB pathway", C: "The Ras-MAPK pathway", D: "The Wnt/β-catenin pathway", E: "The cGMP/PKG pathway" },
                correctAnswer: "C",
                rationale: "KRAS is a small G-protein that functions as a critical node downstream of many growth factor receptors, including EGFR. When activated by binding GTP, Ras recruits and activates Raf kinase, initiating a phosphorylation cascade known as the MAPK (mitogen-activated protein kinase) pathway (Raf -> MEK -> ERK), which ultimately leads to the expression of genes that drive cell proliferation.",
                source: "Source (Cell Signaling, Slide 32): The 'The Ras-MAPK Pathway' diagram shows RAS activating RAF, which leads through MEK and ERK to 'Proliferation'."
            },
            {
                learningObjective: "LO4 (Cell Signaling): Identify the central pathways activated by growth factors and how their dysregulation contributes to cancer.",
                question: "The tumor suppressor protein PTEN is frequently mutated or deleted in many types of human cancers. The loss of PTEN function contributes to cancer by increasing cell survival and proliferation. PTEN is a phosphatase that acts on which of the following signaling molecules?",
                options: { A: "Phosphoinositide 3,4,5-trisphosphate (PIP3)", B: "Cyclic AMP (cAMP)", C: "Diacylglycerol (DAG)", D: "Receptor Tyrosine Kinases (RTKs)", E: "ERK" },
                correctAnswer: "A",
                rationale: "PTEN is a lipid phosphatase whose primary substrate is PIP3. The PI3K-AKT pathway is a key cell survival pathway. PI3K generates the second messenger PIP3, which recruits and activates AKT. PTEN opposes this signal by dephosphorylating PIP3 back to PIP2, thus acting as a brake on the pathway. Loss of PTEN leads to an accumulation of PIP3 and constitutive activation of AKT.",
                source: "Source (Cell Signaling, Slide 33): The diagram 'Synthesis of PI(3,4,5)P3 by PI3K' clearly shows PTEN catalyzing the reverse reaction, converting 'PI(3,4,5)P3' back to 'PIP2'."
            },
            {
                learningObjective: "LO4 (Cell Signaling): Identify the central pathways activated by growth factors and how their dysregulation contributes to cancer.",
                question: "Mutations that cause constitutive activation of the epidermal growth factor receptor (EGFR) are common drivers of non-small cell lung cancer. This leads to ligand-independent dimerization and autophosphorylation of the receptor. This autophosphorylation creates docking sites for which type of signaling protein that contains an SH2 domain?",
                options: { A: "Heterotrimeric G proteins", B: "Adapter proteins like Grb2", C: "Cyclic nucleotide phosphodiesterases", D: "Serine/threonine phosphatases", E: "Nuclear hormone receptors" },
                correctAnswer: "B",
                rationale: "Upon activation, receptor tyrosine kinases (RTKs) like EGFR autophosphorylate specific tyrosine residues in their cytoplasmic tails. These phosphotyrosine residues serve as high-affinity binding sites for proteins containing Src homology 2 (SH2) domains. The adapter protein Grb2 contains an SH2 domain that binds to the activated EGFR, thereby recruiting SOS (a GEF for Ras) to the membrane and initiating the Ras-MAPK cascade.",
                source: "Source (Cell Signaling, Slide 31): The diagram 'Hormone Binding Induces autophosphorylation of RTK's' shows the phosphorylated receptor recruiting 'Grb2' which then interacts with 'SOS' to activate 'Ras'."
            },
            // Pharmacokinetics Questions
            {
                learningObjective: "LO2 (Pharmacokinetics; No LO1): Describe the key pharmacokinetic parameters: volume of distribution (Vd), clearance (Cl) and bioavailability (F).",
                question: "A drug that is highly bound to plasma proteins, such as heparin, is administered intravenously. This drug would be expected to have which of the following characteristics?",
                options: { A: "A large volume of distribution (Vd)", B: "A low volume of distribution (Vd)", C: "High oral bioavailability (F)", D: "Rapid clearance by glomerular filtration", E: "Distribution into adipose tissue" },
                correctAnswer: "B",
                rationale: "The volume of distribution (Vd) is the apparent volume into which a drug distributes. Drugs that are large or highly bound to plasma proteins are generally confined to the vascular (plasma) compartment. Because the plasma volume is small (around 3-5 liters), these drugs have a very low apparent volume of distribution.",
                source: "Source (Pharmacokinetics, Slide 8): 'large drugs/biologics are retained in the vascular compartment (e.g. heparin)' and (Slide 9) Vd is the 'apparent volume in which a quantity of drug is distributed'."
            },
            {
                learningObjective: "LO2 (Pharmacokinetics; No LO1): Describe the key pharmacokinetic parameters...",
                question: "A patient takes an oral dose of a medication. Due to extensive metabolism in the liver before the drug reaches systemic circulation, only 20% of the administered dose becomes active. This phenomenon describes which pharmacokinetic parameter?",
                options: { A: "Volume of distribution (Vd)", B: "Clearance (Cl)", C: "Half-life (T1/2)", D: "Bioavailability (F)", E: "Protein binding" },
                correctAnswer: "D",
                rationale: "Bioavailability (F) is defined as the fraction of an administered dose of unchanged drug that reaches the systemic circulation. For oral drugs, F is often less than 100% due to incomplete absorption and/or first-pass metabolism in the gut wall and liver. An F of 20% (or 0.2) indicates low oral availability.",
                source: "Source (Pharmacokinetics, Slide 7): 'Bioavailability (F) almost always refers to ORAL availability' and is the 'fraction of drug that reaches systemic circulation'. Slide 6 lists the 'first-pass effect' as a major disadvantage of oral administration."
            },
            {
                learningObjective: "LO2 (Pharmacokinetics; No LO1): Describe the key pharmacokinetic parameters...",
                question: "A highly lipophilic drug is administered to a patient. This drug readily crosses cell membranes and accumulates in adipose tissue. This characteristic would result in which of the following?",
                options: { A: "A very small volume of distribution (Vd)", B: "A very large apparent volume of distribution (Vd)", C: "A high rate of renal clearance (Cl)", D: "Low binding to plasma proteins", E: "Elimination primarily as an unchanged drug in the urine" },
                correctAnswer: "B",
                rationale: "Volume of distribution (Vd) is the apparent volume a drug distributes into. If a drug extensively distributes out of the plasma and into tissues like fat, the concentration remaining in the plasma will be very low. Since Vd = Amount / Concentration, a very low plasma concentration results in a very large apparent Vd, often far exceeding the total body water volume.",
                source: "Source (Pharmacokinetics, Slide 10): The diagram '10 g of drug into 1 liter +/- tissue binding' illustrates this principle. With extensive tissue binding, the plasma concentration drops, and the calculated Vd increases significantly (from 1 L to 10 L in the example)."
            },
            {
                learningObjective: "LO3 (Pharmacokinetics): Calculate loading and maintenance doses adjusted for incomplete bioavailability.",
                question: "A patient needs to achieve a target plasma concentration of 10 ng/mL for Drug B, which has a volume of distribution (Vd) of 25 L. What is the appropriate intravenous (IV) loading dose to administer? (Note: 1 ng = 10^-6 mg; 1 mL = 10^-3 L)",
                options: { A: "0.025 mg", B: "0.25 mg", C: "2.5 mg", D: "25 mg", E: "250 mg" },
                correctAnswer: "B",
                rationale: "The loading dose is calculated to rapidly achieve the target concentration by filling the volume of distribution. The formula is Loading Dose = Vd × C_target. It is crucial to ensure consistent units. Vd = 25 L; C_target = 10 ng/mL = 10,000 ng/L = 0.01 mg/L. Loading Dose = 25 L × 0.01 mg/L = 0.25 mg.",
                source: "Source (Pharmacokinetics, Page 34, Question 1): 'Vd × Ctarget = (25×10³ ml) × (10 ng ml⁻¹) = 250×10³ ng = 250,000 ng = 0.25 mg.'"
            },
            {
                learningObjective: "LO3 (Pharmacokinetics): Calculate loading and maintenance doses adjusted for incomplete bioavailability.",
                question: "A physician needs to maintain a target plasma concentration of 3 ng/mL for Drug A. The drug has a clearance (Cl) of 20 L/hr and an oral bioavailability (F) of 50%. What is the required oral maintenance dosing rate?",
                options: { A: "0.03 mg/hr", B: "0.06 mg/hr", C: "0.12 mg/hr", D: "30 mg/hr", E: "120 mg/hr" },
                correctAnswer: "C",
                rationale: "The maintenance dose rate is calculated to replace the amount of drug being eliminated per unit time. The formula is Dosing Rate = (Cl × C_target) / F. First, calculate the IV rate: 20 L/hr × 3 ng/mL = 20,000 mL/hr × 3 ng/mL = 60,000 ng/hr = 0.06 mg/hr. Then, correct for oral bioavailability: 0.06 mg/hr / 0.5 = 0.12 mg/hr.",
                source: "Source (Pharmacokinetics, Page 34, Question 4): '(Cl × Ctarget)/F = ((20×10³ ml hr⁻¹) × (3 ng ml⁻¹))/0.5 = 120×10³ ng hr⁻¹ = 120,000 ng hr⁻¹ = 0.12 mg hr⁻¹.'"
            },

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;
                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;
                    const labelText = document.createElement('span');
                    labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(checkButton);
                
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

            if (!selectedRadioButton) {
                alert("Please select an answer first.");
                return;
            }

            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const feedbackDiv = questionBlockElement.querySelector('.feedback');
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';

            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                 feedbackHTML = `<span class="feedback-status">Incorrect.</span> The correct answer is ${qData.correctAnswer}.`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });

    </script>
